name: Build and Deploy Container

on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/overlays/prod/kustomization.yaml
  repository_dispatch:
    types:
      - link-added
  workflow_dispatch:
    inputs:
      link_id:
        description: Link row id that triggered this deployment
        required: false
      link_url:
        description: Link URL that triggered this deployment
        required: false
      link_title:
        description: Link title that triggered this deployment
        required: false
      content_type:
        description: Link content type that triggered this deployment
        required: false

permissions:
  contents: write
  packages: write

jobs:
  build-push-and-update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/senthil-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/senthil-api:latest

      - name: Update Kustomize image tag
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER}/senthil-api"
          IMAGE_TAG="${GITHUB_SHA}"

          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" k8s/overlays/prod/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" k8s/overlays/prod/kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/prod/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "ci: deploy ${GITHUB_SHA}"
          git push
