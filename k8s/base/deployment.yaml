apiVersion: apps/v1
kind: Deployment
metadata:
  name: senthilapi
  namespace: senthilapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: senthilapi
  template:
    metadata:
      labels:
        app: senthilapi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: senthilapi
          image: ghcr.io/s3nthilg0pal/senthil-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: senthilapi-config
            - secretRef:
                name: senthilapi-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
